name: Isolate Windows AMX buffer release
on:
  push:
    branches: [diag/openblas-shutdown-20261119]
    paths: [.github/workflows/diagnose-windows-amx.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolate:
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        fix: [false, true]
        sanitize: [false, true]
    steps:
      - uses: actions/checkout@v6
      - shell: pwsh
        run: choco install ninja --yes --no-progress
      - name: Create direct AMX allocation probe
        shell: python
        run: |
          from pathlib import Path
          if '${{ matrix.fix }}' == 'true':
              path = Path('ggml/src/ggml-cpu/amx/amx.cpp')
              text = path.read_text()
              old = '    free(buffer->context);'
              assert text.count(old) == 1
              path.write_text(text.replace(old, '    ggml_aligned_free(buffer->context, buffer->size);'))
          import re
          source = Path('ggml/src/ggml-cpu/amx/amx.cpp').read_text()
          function = re.search(r'static void ggml_backend_amx_buffer_free_buffer\([^}]+}', source).group()
          probe = r'''
          #include "ggml-backend-impl.h"
          #include "ggml-impl.h"
          #include <cstdio>
          FUNCTION
          int main() {
              std::setvbuf(stdout, nullptr, _IONBF, 0);
              ggml_backend_buffer buffer = {};
              buffer.context = ggml_aligned_malloc(4096);
              buffer.size = 4096;
              if (!buffer.context) return 2;
              std::printf("Allocated aligned AMX storage at %p, now invoking its source release function\n", buffer.context);
              ggml_backend_amx_buffer_free_buffer(&buffer);
              std::puts("AMX buffer release returned successfully");
              return 0;
          }
          '''
          Path('amx-buffer-probe.cpp').write_text(probe.replace('FUNCTION', function))
          with Path('CMakeLists.txt').open('a') as f:
              f.write('\nadd_executable(amx-buffer-probe amx-buffer-probe.cpp)\ntarget_include_directories(amx-buffer-probe PRIVATE ggml/src)\ntarget_link_libraries(amx-buffer-probe PRIVATE ggml-base)\n')
      - name: Build source release function and common allocator with ASAN
        shell: pwsh
        run: |
          $flags = @()
          if ('${{ matrix.sanitize }}' -eq 'true') {
            $flags += '-DCMAKE_C_FLAGS=-fsanitize=address -g'
            $flags += '-DCMAKE_CXX_FLAGS=-fsanitize=address -g'
            $flags += '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address'
            $flags += '-DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address'
          }
          cmake -S . -B build -G 'Ninja Multi-Config' '-DCMAKE_TOOLCHAIN_FILE=cmake/x64-windows-llvm.cmake' -DGGML_CPU=OFF -DGGML_BLAS=OFF -DLLAMA_BUILD_UI=OFF -DLLAMA_BUILD_SERVER=OFF @flags
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build --config RelWithDebInfo --target amx-buffer-probe -j 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ('${{ matrix.sanitize }}' -eq 'true') {
            $resource = (& clang --print-resource-dir).Trim()
            $runtime = Get-ChildItem $resource -Recurse -Filter 'clang_rt.asan*.dll'
            if (!$runtime) { throw "ASAN runtime DLL missing under $resource" }
            $runtime | ForEach-Object { Copy-Item $_.FullName build/bin/RelWithDebInfo/ -Force }
          }
      - name: Exercise exactly one AMX allocation and release
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $env:PATH = "C:/Program Files/LLVM/bin;$env:PATH"
          $env:ASAN_OPTIONS = 'halt_on_error=1:symbolize=1'
          New-Item -ItemType Directory diagnostics
          & ./build/bin/RelWithDebInfo/amx-buffer-probe.exe *> diagnostics/amx.txt
          $result = $LASTEXITCODE
          Get-Content diagnostics/amx.txt
          "fix=${{ matrix.fix }} asan=${{ matrix.sanitize }} exit=$result" | Tee-Object diagnostics/result.txt
          if ('${{ matrix.fix }}' -eq 'true' -and $result -ne 0) { exit 1 }
          if ('${{ matrix.fix }}' -eq 'false') {
            if ('${{ matrix.sanitize }}' -eq 'true') {
              if (!(Select-String -Path diagnostics/amx.txt -Pattern 'attempting free on address which was not malloc')) { exit 1 }
            } elseif ($result -ne -1073740940) { exit 1 }
          }
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amx-release-fix-${{ matrix.fix }}-asan-${{ matrix.sanitize }}
          path: diagnostics
